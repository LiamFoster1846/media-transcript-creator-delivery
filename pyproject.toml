[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "media-brief-search"
version = "0.1.0"
description = "Embed streaming transcripts, find relevant moments, and prepare creator briefs."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.50,<2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
run-creator-delivery = "media_delivery.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["media_delivery*"]
